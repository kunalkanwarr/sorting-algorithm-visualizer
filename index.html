<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sorting Visualizer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar navbar-dark bg-dark px-3">
    <span class="navbar-brand">Sorting Visualizer</span>

    <span class="text-light">
        Bars
        <input id="arr_sz" type="range" min="20" max="120" value="60">
    </span>

    <span class="text-light">
        Speed
        <input id="speed_input" type="range" min="5" max="200" value="20">
    </span>

    <button id="newArray" class="btn btn-warning">New Array</button>
    <button class="btn btn-dark bubble sort">Bubble</button>
    <button class="btn btn-dark selection sort">Selection</button>
    <button class="btn btn-dark insertion sort">Insertion</button>
    <button class="btn btn-dark quick sort">Quick</button>
    <button class="btn btn-dark merge sort">Merge</button>
</nav>

<div id="barsContainer" class="bars-container"></div>

<script src="js/script.js"></script>
</body>
</html>
